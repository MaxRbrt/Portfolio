<svg width="960" height="640" viewBox="0 0 960 640" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Portfolio showcase</title>
  <desc id="desc">Illustrative portfolio mockup with 3D hero, project cards and scroll rhythm.</desc>
  <defs>
    <linearGradient id="bg" x1="54" x2="898" y1="34" y2="608" gradientUnits="userSpaceOnUse">
      <stop stop-color="#05070A"/>
      <stop offset=".46" stop-color="#102132"/>
      <stop offset="1" stop-color="#05070A"/>
    </linearGradient>
    <linearGradient id="hero" x1="274" x2="716" y1="144" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFBF69"/>
      <stop offset=".48" stop-color="#57B8FF"/>
      <stop offset="1" stop-color="#8EE6A7"/>
    </linearGradient>
    <filter id="shadow" x="100" y="66" width="760" height="516" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="30" stdDeviation="34" flood-color="#000" flood-opacity=".38"/>
    </filter>
  </defs>
  <rect width="960" height="640" fill="url(#bg)"/>
  <circle cx="734" cy="176" r="122" fill="#57B8FF" opacity=".12"/>
  <circle cx="188" cy="496" r="152" fill="#FFBF69" opacity=".1"/>
  <g filter="url(#shadow)">
    <rect x="150" y="106" width="660" height="422" rx="34" fill="#0B1118" stroke="#FFFFFF" stroke-opacity=".14" stroke-width="2"/>
    <rect x="186" y="144" width="588" height="56" rx="18" fill="#111A23"/>
    <rect x="214" y="166" width="88" height="10" rx="5" fill="#F7F3E8" opacity=".82"/>
    <rect x="620" y="160" width="114" height="24" rx="12" fill="#FFBF69"/>
    <text x="214" y="288" fill="#F7F3E8" font-family="Arial, sans-serif" font-size="56" font-weight="900">Marcos</text>
    <text x="214" y="348" fill="#57B8FF" font-family="Arial, sans-serif" font-size="54" font-weight="900">Developer</text>
    <circle cx="612" cy="318" r="82" fill="url(#hero)" opacity=".86"/>
    <circle cx="612" cy="318" r="132" stroke="#F7F3E8" stroke-opacity=".16" stroke-width="3"/>
    <circle cx="612" cy="318" r="176" stroke="#57B8FF" stroke-opacity=".16" stroke-width="2" stroke-dasharray="10 15"/>
    <rect x="210" y="414" width="132" height="56" rx="18" fill="#111A23"/>
    <rect x="374" y="414" width="132" height="56" rx="18" fill="#111A23"/>
    <rect x="538" y="414" width="132" height="56" rx="18" fill="#111A23"/>
    <rect x="232" y="436" width="74" height="10" rx="5" fill="#FFBF69"/>
    <rect x="396" y="436" width="74" height="10" rx="5" fill="#57B8FF"/>
    <rect x="560" y="436" width="74" height="10" rx="5" fill="#8EE6A7"/>
